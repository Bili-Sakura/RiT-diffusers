[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diffusers-rit"
version = "0.1.0"
description = "Diffusers-style RiT (Representation Image Transformer) components."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "diffusers>=0.38.0",
    "torch",
    "torchvision",
    "transformers>=4.57.0",
    "safetensors",
    "einops",
    "numpy",
    "Pillow",
    "huggingface_hub",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
